name: "🧪 Node.js Tests"

on: [pull_request]

jobs:
  node-integration:
    name: Node.js Integration (soft-fail)
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        go-version: ['1.25']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # Non-blocking: failures don't fail the workflow
    continue-on-error: true
    # Hard ceiling so a hung cycletls subprocess (held alive by --detectOpenHandles)
    # can't drag a job out to the GitHub default 6h limit.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: ./cycletls/go.sum

      - name: Install npm dependencies
        run: npm ci
        working-directory: ./

      - name: Run Integration Tests
        id: integration-tests
        # --forceExit overrides package.json's --detectOpenHandles so a leaked
        # cycletls subprocess doesn't keep Jest alive after assertions complete.
        run: npm test -- --testPathIgnorePatterns=tlsfingerprint --forceExit
        working-directory: ./

      - name: Report integration test results
        if: always()
        run: |
          if [ "${{ steps.integration-tests.outcome }}" == "failure" ]; then
            echo "::warning::Integration tests failed - see logs for details"
          fi

  node-tls-fingerprint:
    name: Node.js TLS Fingerprint (soft-fail)
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        go-version: ['1.25']
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # Soft-fail: tests hit external fixtures (tls.peet.ws, tlsfingerprint.com)
    # that intermittently rate-limit or 408. Matches the Go Integration
    # (soft-fail) treatment for the same root cause. Failures still surface
    # in the UI but don't gate merges.
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: ./cycletls/go.sum

      - name: Install npm dependencies
        run: npm ci
        working-directory: ./

      - name: Run TLS Fingerprint Tests
        run: npm test -- --testPathPattern=tlsfingerprint --forceExit
        working-directory: ./
